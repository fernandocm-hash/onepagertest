<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  .fn-search-widget {
    --blue: #166DCB;
    --text: #0F172A;
    --muted: #64748B;
    --border: #E2E8F0;
    --chip-bg: #F2F1ED;
    --chip-bg-hover: #E7E5DF;
    --chip-text: #6B7280;
    --card-bg: #ffffff;
    --accent: #B9EB5C;
    --accent-hover: #A9DB4C;
    font-family: 'DM Sans', sans-serif;
    max-width: 1100px;
    margin: 0 auto;
  }
  .fn-search-widget .fn-card {
    background: var(--card-bg);
    border: none;
    border-radius: 15px;
    padding: 18px 22px 16px;
  }
  .fn-search-widget .fn-input-row {
    display: flex;
    align-items: center;
    gap: 15px;
    background: transparent;
    border: none;
    padding: 4px 4px 12px;
  }
  .fn-search-widget .fn-input-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  .fn-search-widget .fn-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 17px;
    font-weight: 400;
    color: var(--text);
  }
  .fn-search-widget .fn-input::placeholder { color: #94A3B8; }
  .fn-search-widget .fn-cursor {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 1px;
    height: 19px;
    background: #94A3B8;
    display: none;
    animation: fn-blink 1s step-end infinite;
    pointer-events: none;
  }
  .fn-search-widget .fn-input:placeholder-shown:not(:focus) ~ .fn-cursor {
    display: block;
  }
  @keyframes fn-blink { 50% { opacity: 0; } }
  .fn-search-widget .fn-submit {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .fn-search-widget .fn-submit:hover { background: var(--accent-hover); }
  .fn-search-widget .fn-submit:active { transform: scale(0.95); }
  .fn-search-widget .fn-submit svg { width: 20px; height: 20px; }
  .fn-search-widget .fn-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }
  .fn-search-widget .fn-chip {
    font-family: inherit;
    font-size: 11px;
    color: var(--chip-text);
    background: var(--chip-bg);
    border: none;
    border-radius: 100px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .fn-search-widget .fn-chip:hover { background: var(--chip-bg-hover); color: var(--text); }
</style>

<div class="fn-search-widget">
  <div class="fn-card">
    <form class="fn-input-row" id="fnSearchForm">
      <div class="fn-input-wrap">
        <input
          type="text"
          class="fn-input"
          id="fnSearchInput"
          placeholder="Try the analyst now by typing your market intelligence query here.."
          autocomplete="off"
        />
        <span class="fn-cursor" aria-hidden="true"></span>
      </div>
      <button type="submit" class="fn-submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" fill="#0F172A"/>
          <path d="m21.854 2.147-10.94 10.939" stroke="#0F172A" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
    <div class="fn-chips">
      <button type="button" class="fn-chip">Give me companies working on synthetic biology</button>
      <button type="button" class="fn-chip">Give me similar companies to...</button>
      <button type="button" class="fn-chip">What are the top trends in home robotics?</button>
    </div>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('fnSearchForm');
  var input = document.getElementById('fnSearchInput');
  var chips = document.querySelectorAll('.fn-search-widget .fn-chip');
  var baseUrl = 'https://app.klaro.io/analyst';

  function goToKlaro(query) {
    var q = (query || '').trim();
    var url = baseUrl;
    if (q) {
      url += '?prompt=' + encodeURIComponent(q);
    }
    window.location.href = url;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    goToKlaro(input.value);
  });

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      input.value = chip.textContent;
      input.focus();
    });
  });
})();
</script>
